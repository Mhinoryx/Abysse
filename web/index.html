<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abysse Quiz</title>
    <meta name="description" content="Quiz abyssal jouable en ligne sur Cloudflare" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="bubbleLayer" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>ABYSSE</h1>
        </div>
      </header>

      <main class="panel">
        <section id="menuScreen" class="screen">
          <div class="card intro-card">
            <div class="setup-grid">
              <div class="field">
                <label for="playerName">Pseudo</label>
                <input id="playerName" type="text" value="" maxlength="20" placeholder="Choisis ton pseudo" />
                <div id="pseudoHint" class="pseudo-hint hidden">Choisis ton pseudo pour continuer</div>
              </div>

              <div id="setupLockedContent" class="hidden">
                <div class="field">
                  <label>Choix du niveau</label>
                  <div class="difficulty-inline" id="difficultyButtons">
                    <button type="button" class="difficulty-btn active" data-difficulty="facile">Facile</button>
                    <button type="button" class="difficulty-btn" data-difficulty="moyen">Moyen</button>
                    <button type="button" class="difficulty-btn" data-difficulty="difficile">Difficile</button>
                  </div>
                </div>

                <div class="field">
                  <label for="roomInput">Salon</label>
                  <input id="roomInput" type="text" placeholder="Code de salon" maxlength="8" />
                </div>
              </div>
            </div>

            <div class="button-stack">
              <button id="createRoomBtn" class="primary-btn" disabled>Créer un salon</button>
              <button id="joinRoomBtn" class="secondary-btn" disabled>Rejoindre</button>
              <button id="soloBtn" class="secondary-btn" disabled>Mode solo</button>
            </div>
          </div>
        </section>

        <section id="lobbyScreen" class="screen hidden">
          <div class="card">
            <div class="section-head">
              <div>
                <p class="label">Salon</p>
                <h3 id="roomCodeLabel">Code: —</h3>
              </div>
              <div class="button-group-inline">
                <button id="startGameBtn" class="primary-btn compact">Lancer la partie</button>
                <button id="lobbyHomeBtn" class="secondary-btn compact">Accueil</button>
              </div>
            </div>

            <div id="shareBox" class="share-box">
              <div class="share-info">
                <p class="label">Code du salon</p>
                <div id="joinCode" class="join-code">—</div>
                <p class="label">Partage</p>
                <div id="joinLink" class="join-link">—</div>
              </div>
              <img id="qrCode" class="qr-code" alt="QR code pour rejoindre le salon" />
            </div>

            <ul id="playerList" class="player-list"></ul>
          </div>
        </section>

        <section id="gameScreen" class="screen hidden">
          <div class="card">
            <div class="question-topbar">
              <span id="questionBadge" class="pill">Question 1</span>
              <span id="timerBadge" class="pill timer-pill">15s</span>
            </div>

            <div class="game-actions">
              <button id="gameHomeBtn" class="secondary-btn compact">Accueil</button>
            </div>

            <h2 id="questionText">Chargement…</h2>
            <div id="answers" class="answers"></div>
          </div>
        </section>

        <section id="resultsScreen" class="screen hidden">
          <div class="card results-card">
            <p class="label">Classement final</p>
            <h3 id="winnerText">Le plus profond a gagné !</h3>
            <ul id="resultsList" class="player-list"></ul>
            <div class="button-stack row">
              <button id="playAgainBtn" class="primary-btn compact">Rejouer</button>
              <button id="backMenuBtn" class="secondary-btn">Menu</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
